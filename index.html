<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>College Application Support</title>
<link rel="preload" href="type/Inter.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="header">
  <div class="header-left">
    <div class="logo-img">
      <img src="logo/dcac-white.png" alt="Destination College Advising Corps">
      <img src="logo/eaop-white.png" alt="Early Academic Outreach Program">
    </div>
  </div>
  <div class="header-right">
    <h1>College Application Support, Mr. Martinez & Ms. Alanna</h1>
  </div>
</header>

<div class="newTicket">
  <div>
    <div class="sub">Submit a ticket to put your name in line to get help from us!<br> Watch its status here.</div>
    <div class="status-line" id="statusLine">Loading tickets…</div>
  </div>
  <button id="newTicketBtn">New ticket</button>
</div>

<main>
  <section class="column in-progress">
    <h2>In progress <span class="count" id="progressCount"></span></h2>
    <div id="progressList"></div>
  </section>
  <section class="column completed">
    <h2>Completed <span class="count" id="doneCount"></span></h2>
    <div id="doneList"></div>
  </section>
</main>

<dialog id="ticketDialog">
  <form id="ticketForm">
    <h2>Request support</h2>
    <label>Name
      <input name="name" required maxlength="100" autocomplete="name" placeholder="First and last name">
    </label>
    <label>Support type
      <textarea name="supportType" required maxlength="300" rows="3" placeholder="What do you need help with?"></textarea>
    </label>
    <fieldset class="choices">
      <legend>Requesting support from <span class="hint">(choose one or both)</span></legend>
      <label class="choice"><input type="checkbox" name="adviser" value="Mr. Martinez"> Mr. Martinez</label>
      <label class="choice"><input type="checkbox" name="adviser" value="Ms. Alanna"> Ms. Alanna</label>
    </fieldset>
    <label>Location (optional)
      <input name="location" maxlength="100" placeholder="e.g. Main room, Breakout Room 3">
    </label>
    <p class="error" id="formError"></p>
    <div class="actions">
      <button type="button" class="secondary" id="cancelBtn">View board</button>
      <button type="submit" id="submitBtn">Submit ticket</button>
    </div>
  </form>
</dialog>

<script>
  // Paste the Apps Script web app URL (ends in /exec) here.
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzzrzx9vundDPA3fjzf9SLaPx9h3L227_ZJJxZm42VYnxPQZeTDcx425YtoeDejmyiD4A/exec';
  const REFRESH_MS = 5000;        // while the tab is visible
  const HIDDEN_REFRESH_MS = 60000; // while the tab is in the background
  const MY_TICKETS_KEY = 'myTicketRows';

  const $ = (id) => document.getElementById(id);
  const dialog = $('ticketDialog');
  const form = $('ticketForm');

  function myRows() {
    try { return JSON.parse(localStorage.getItem(MY_TICKETS_KEY) || '[]'); } catch { return []; }
  }
  function rememberRow(row) {
    try { localStorage.setItem(MY_TICKETS_KEY, JSON.stringify([...myRows(), row].slice(-20))); } catch {}
  }

  function formatTime(iso) {
    const d = new Date(iso);
    return isNaN(d) ? iso : d.toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  }

  function ticketEl(t, mine) {
    const div = document.createElement('div');
    div.className = 'ticket' + (mine ? ' mine' : '');
    const top = document.createElement('div');
    top.className = 'ticket-top';
    const name = document.createElement('strong');
    name.textContent = t.name + (mine ? ' (you)' : '');
    const pill = document.createElement('span');
    pill.className = 'pill s-' + t.status.toLowerCase().replace(/[^a-z]+/g, '-');
    pill.textContent = t.status;
    top.append(name, pill);
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = [t.adviser, t.location].filter(Boolean).join(' · ');
    const times = document.createElement('div');
    times.className = 'times';
    times.textContent = 'Posted ' + formatTime(t.created) + (t.completedAt ? ' · Completed ' + formatTime(t.completedAt) : '');
    div.append(top, meta, times);
    return div;
  }

  function render(tickets) {
    const mine = new Set(myRows());
    const newestFirst = (a, b) => new Date(b.created) - new Date(a.created);
    const groups = [
      [tickets.filter(t => !t.completed).sort(newestFirst), $('progressList'), $('progressCount'), 'No tickets in progress.'],
      [tickets.filter(t => t.completed).sort(newestFirst), $('doneList'), $('doneCount'), 'No completed tickets yet.'],
    ];
    for (const [list, el, countEl, emptyText] of groups) {
      el.replaceChildren(...(list.length
        ? list.map(t => ticketEl(t, mine.has(t.id)))
        : [Object.assign(document.createElement('p'), { className: 'empty', textContent: emptyText })]));
      countEl.textContent = list.length;
    }
  }

  let lastPayload = '';
  let loading = false;
  async function loadTickets() {
    if (loading) return;
    loading = true;
    try { await fetchTickets(); } finally { loading = false; }
  }

  async function fetchTickets() {
    if (SCRIPT_URL.startsWith('PASTE')) {
      $('statusLine').textContent = 'Not connected yet: set SCRIPT_URL in index.html.';
      return;
    }
    try {
      const res = await fetch(SCRIPT_URL);
      const data = await res.json();
      if (!data.ok) throw new Error(data.error);
      const payload = JSON.stringify(data.tickets);
      if (payload !== lastPayload) { lastPayload = payload; render(data.tickets); }
      $('statusLine').textContent = 'Updated ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) + '. Refreshes automatically.';
    } catch (err) {
      $('statusLine').textContent = 'Could not load tickets. Retrying shortly.';
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    $('formError').textContent = '';
    if (SCRIPT_URL.startsWith('PASTE')) { $('formError').textContent = 'The form is not connected to the sheet yet.'; return; }
    const fd = new FormData(form);
    const advisers = fd.getAll('adviser');
    if (!advisers.length) { $('formError').textContent = 'Choose Mr. Martinez, Ms. Alanna, or both.'; return; }
    const payload = { name: fd.get('name'), supportType: fd.get('supportType'), adviser: advisers.join(', '), location: fd.get('location') };
    $('submitBtn').disabled = true;
    try {
      // text/plain avoids a CORS preflight, which Apps Script does not answer.
      const res = await fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'Something went wrong.');
      rememberRow(data.row);
      form.reset();
      dialog.close();
      loadTickets();
    } catch (err) {
      $('formError').textContent = err.message || 'Could not submit. Please try again.';
    } finally {
      $('submitBtn').disabled = false;
    }
  });

  $('newTicketBtn').addEventListener('click', () => dialog.showModal());
  $('cancelBtn').addEventListener('click', () => dialog.close());

  dialog.showModal(); // form pops up on first visit
  // Poll every 5s while visible, slow down in the background, and refresh
  // immediately when someone comes back to the tab.
  let timer;
  function schedule() {
    clearTimeout(timer);
    timer = setTimeout(async () => { await loadTickets(); schedule(); },
      document.hidden ? HIDDEN_REFRESH_MS : REFRESH_MS);
  }
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) loadTickets();
    schedule();
  });
  loadTickets().then(schedule);
</script>
</body>
</html>
